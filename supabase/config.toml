# Google Calendar own-OAuth integration
# The callback is invoked by Google's redirect (no user JWT), and the OAuth
# start/status/create-test-event/disconnect functions validate the caller's
# Supabase JWT internally via getUser().
[functions.google-calendar-oauth-callback]
verify_jwt = false

[functions.google-calendar-oauth-start]
verify_jwt = false

[functions.google-calendar-status]
verify_jwt = false

[functions.google-calendar-create-test-event]
verify_jwt = false

[functions.google-calendar-disconnect]
verify_jwt = false