      /* P0 startup fallback — visible before any CSS/JS bundle loads.

      #aa-startup-fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#3b3a2f;background:#f5f0e8;z-index:0;}

    <script>
      // Pages are prerendered for crawlers. When this HTML is served for a
      // different address (the app shell fallback), hide the prerendered
      // page, show the spinner and drop tags that belong to that page only.
      (function () {
        var m = document.querySelector('meta[name="aa-prerendered-path"]');
        var p = location.pathname.replace(/\/+$/, "") || "/";
        if (!m || m.getAttribute("content") !== p) {
          document.documentElement.classList.add("aa-shell");
          if (m) {
            var tags = document.querySelectorAll('[data-aa-route-meta]');
            for (var i = 0; i < tags.length; i++) tags[i].parentNode.removeChild(tags[i]);
          }
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <div id="aa-startup-fallback" role="status" aria-live="polite" aria-label="Loading">
      <div class="aa-spin" aria-hidden="true"></div>
    </div>
    <script>
      // P0: surface bootstrap errors instead of a silent white screen.
      (function () {
        function showError(msg) {
          var el = document.getElementById("aa-startup-fallback");
          if (!el) return;
          // A prerendered page stays readable; only the app shell shows the error.
          if (!document.documentElement.classList.contains("aa-shell")) return;
          var safe = String(msg || "Unknown error");
          if (safe.length > 240) safe = safe.slice(0, 240) + "…";
          el.innerHTML =
            '<div id="aa-startup-error">' +
              '<p class="aa-startup-title">Alchemy Academy could not start.</p>' +
              '<p>Reload the page. If the issue persists, your network or session may need attention.</p>' +
              '<button type="button" onclick="location.reload()">Reload</button>' +
              '<code></code>' +
            '</div>';
          var code = el.querySelector("code");
          if (code) code.textContent = safe;
        }
        window.__aaStartupError = showError;
        window.addEventListener("error", function (e) {
          if (document.getElementById("aa-startup-fallback")) {
            showError((e && e.message) || "Script error");
          }
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (document.getElementById("aa-startup-fallback")) {
            var r = e && e.reason;
            showError((r && (r.message || String(r))) || "Unhandled promise rejection");
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
