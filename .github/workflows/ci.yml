name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "prelaunch/**"
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck • Test • Lint • Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bun run typecheck

      - name: Test
        id: test
        shell: bash
        run: |
          if bun run test > /tmp/alchemy-tests.log 2>&1; then
            cat /tmp/alchemy-tests.log
          else
            echo "Tests failed. Showing the final 180 lines:"
            tail -n 180 /tmp/alchemy-tests.log
            exit 1
          fi

      - name: Lint
        id: lint
        run: bun run lint

      - name: Build
        id: build
        run: bun run build

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "# CI Summary"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Test      | ${{ steps.test.outcome }} |"
            echo "| Lint      | ${{ steps.lint.outcome }} |"
            echo "| Build     | ${{ steps.build.outcome }} |"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
